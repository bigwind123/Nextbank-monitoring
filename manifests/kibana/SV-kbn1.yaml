apiVersion: v1
kind: Service
metadata:
  name: observability-kbn1
  namespace: observability
spec:
  ipFamilies:
  - IPv4
  ports:
  - name: web
    protocol: TCP
    port: 5601
    targetPort: 5601
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: kbn1
