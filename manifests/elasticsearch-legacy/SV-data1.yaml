apiVersion: v1
kind: Service
metadata:
  name: observability-data1
  namespace: observability
spec:
  ipFamilies:
  - IPv4
  ports:
  - name: tcp-9200
    protocol: TCP
    port: 9200
    targetPort: 9200
  - name: tcp-9300
    protocol: TCP
    port: 9300
    targetPort: 9300
    nodePort: 32716
  internalTrafficPolicy: Cluster
  type: NodePort
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: data1
