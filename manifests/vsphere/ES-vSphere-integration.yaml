apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: observability
  name: vsphere-integration
  labels:
    app: vsphere-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vsphere-integration
  template:
    metadata:
      labels:
        app: vsphere-integration
    spec:
      containers:
      - name: vsphere-integration
        env:
        - name: FLEET_ENROLL
          value: '1'
        - name: FLEET_URL
          value: __CFG_1564__
        - name: FLEET_ENROLLMENT_TOKEN
          value: __CFG_0022__
        - name: FLEET_INSECURE
          value: 'true'
        image: __CFG_1565__
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: __CFG_1534__
