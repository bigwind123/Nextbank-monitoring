apiVersion: v1
kind: Service
metadata:
  name: python-ldap-network
  namespace: observability
spec:
  ipFamilies:
  - IPv4
  ports:
  - name: transfer-port
    protocol: TCP
    port: 8888
    targetPort: 8888
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: python-ldap-network
