apiVersion: v1
kind: Service
metadata:
  name: observability-ngx1
  namespace: observability
spec:
  ipFamilies:
  - IPv4
  ports:
  - name: proxy-redirect-adm
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: proxy-redirect-ro
    protocol: TCP
    port: 8081
    targetPort: 8081
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: ngx1
