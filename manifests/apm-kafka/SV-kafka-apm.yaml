kind: Service
apiVersion: v1
metadata:
  name: kafka-headless
  namespace: observability
  labels:
    app: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ipFamilies:
  - IPv4
  ports:
  - name: internal-plain
    protocol: TCP
    port: 9092
    targetPort: 9092
  - name: controller
    protocol: TCP
    port: 9093
    targetPort: 9093
  internalTrafficPolicy: Cluster
  clusterIPs:
  - None
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: kafka
