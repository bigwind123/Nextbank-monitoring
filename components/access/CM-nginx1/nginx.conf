worker_processes  1;

pid /tmp/nginx.pid;


events {
    worker_connections  1024;
}
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost __CFG_1508__;

        location / {
        auth_request /auth-proxy;
        proxy_set_header Authorization "Basic __CFG_1500__";
        proxy_pass __CFG_1275__;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";
        }

        location = /auth-proxy {
            internal;
            proxy_pass __CFG_1507__;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Ldap-URL     "__CFG_1502__";
            proxy_set_header X-Ldap-BaseDN  "__CFG_1503__";
            proxy_set_header X-Ldap-Template "__CFG_1504__";
            proxy_set_header X-Ldap-BindDN  "__CFG_1505__";
            proxy_set_header X-Ldap-BindPass "__CFG_1506__";
        }
    }
    server {
        listen       8081;
        server_name  localhost __CFG_1508__;

        location / {
        auth_request /auth-proxy;
        proxy_set_header Authorization "Basic __CFG_1501__";
        proxy_pass __CFG_1275__;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";
        }

        location = /auth-proxy {
            internal;
            proxy_pass __CFG_1507__;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Ldap-URL     "__CFG_1502__";
            proxy_set_header X-Ldap-BaseDN  "__CFG_1503__";
            proxy_set_header X-Ldap-Template "__CFG_1504__";
            proxy_set_header X-Ldap-BindDN  "__CFG_1505__";
            proxy_set_header X-Ldap-BindPass "__CFG_1506__";
        }
    }
}
