worker_processes  1;
pid /tmp/nginx.pid;


events {
    worker_connections  1024;
}
http {
    client_body_temp_path /tmp/client_temp 1 2;
    proxy_temp_path       /tmp/proxy_temp 1 2;
    fastcgi_temp_path     /tmp/fastcgi_temp 1 2;
    uwsgi_temp_path       /tmp/uwsgi_temp 1 2;
    scgi_temp_path        /tmp/scgi_temp 1 2;
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost __CFG_1511__;

        location / {
        auth_request /auth-proxy;
        proxy_set_header Authorization "";
        proxy_pass __CFG_1509__;
        proxy_redirect default;
        proxy_buffering on;
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";
        }

        location = /auth-proxy {
            internal;
            proxy_pass __CFG_1510__;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Ldap-URL     "__CFG_1502__";
            proxy_set_header X-Ldap-BaseDN  "__CFG_1503__";
            proxy_set_header X-Ldap-Template "__CFG_1504__";
            proxy_set_header X-Ldap-BindDN  "__CFG_1505__";
            proxy_set_header X-Ldap-BindPass "__CFG_1506__";
        }
    }
}
