input {
  udp {
    port => 5400
    source_ip_fieldname => "[appliance][monitoring][ip]"
    codec => plain
  }
}
filter {
  mutate {
    add_field => { "[data_stream][type]" => "logs" "[data_stream][dataset]" => "network" "[data_stream][namespace]" => "default" }
  }
}
output {
  elasticsearch {
    hosts => ["${ES_BASE}"]
    user => "${WRITER_USER}"
    password => "${WRITER_PASSWORD}"
    ssl_certificate_authorities => ["/runtime/certs/ca/ca.crt"]
    data_stream => true
  }
}
