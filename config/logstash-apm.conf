input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS}"
    topics_pattern => "apm-.*"
    group_id => "apm-indexing"
    codec => json
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    consumer_threads => 3
  }
}
output {
  elasticsearch {
    hosts => ["${ES_BASE}"]
    user => "${WRITER_USER}"
    password => "${WRITER_PASSWORD}"
    ssl_certificate_authorities => ["/runtime/certs/ca/ca.crt"]
    ssl_verification_mode => full
    data_stream => true
    data_stream_auto_routing => true
  }
}
