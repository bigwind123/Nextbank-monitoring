name: observability
x-app: &app
  image: observability-app:local
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  environment:
    PLATFORM_CONFIG: /runtime/platform.json
  volumes:
    - ${RUNTIME_DIR}:/runtime
  restart: unless-stopped
  user: "1000:0"
x-es: &es
  image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
  ulimits:
    memlock: {soft: -1, hard: -1}
  environment: &es-env
    ES_JAVA_OPTS: -Xms512m -Xmx512m
    ELASTIC_PASSWORD_FILE: /runtime/secrets/es-bootstrap-password
    LISTEN_HOST: ${LISTEN_HOST}
    SEED_HOSTS: master
    INITIAL_MASTERS: master
  volumes:
    - ${RUNTIME_DIR}:/runtime:ro
    - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
  depends_on:
    certificates: {condition: service_completed_successfully}
  restart: unless-stopped
services:
  certificates:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    user: "0"
    entrypoint: [bash, /scripts/certificates.sh]
    volumes:
      - ${RUNTIME_DIR}:/runtime
      - ./scripts:/scripts:ro
  master:
    <<: *es
    environment:
      <<: *es-env
      NODE_NAME: master
      NODE_ROLES: master,ingest,transform,remote_cluster_client
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ${RUNTIME_DIR}/master.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - master-data:/usr/share/elasticsearch/data
  hot:
    <<: *es
    environment:
      <<: *es-env
      NODE_NAME: hot
      NODE_ROLES: data_hot,data_content
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ${RUNTIME_DIR}/hot.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - hot-data:/usr/share/elasticsearch/data
  cold:
    <<: *es
    environment:
      <<: *es-env
      NODE_NAME: cold
      NODE_ROLES: data_cold
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ${RUNTIME_DIR}/cold.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - cold-data:/usr/share/elasticsearch/data
  coordination:
    <<: *es
    environment:
      <<: *es-env
      NODE_NAME: coordination
      NODE_ROLES: ""
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ${RUNTIME_DIR}/coordination.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - coordination-data:/usr/share/elasticsearch/data
    ports: ["${LOCAL_BIND}:${ES_PORT}:9200"]
  bootstrap-security:
    <<: *app
    command: [scripts.bootstrap, security]
    restart: "no"
    depends_on:
      coordination: {condition: service_started}
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.19
    env_file: ["${RUNTIME_DIR}/elastic.env"]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
    restart: unless-stopped
  directory:
    build: {context: ., dockerfile: docker/ldap.Dockerfile}
    image: observability-directory:local
    environment:
      LDAP_LISTEN: ${LDAP_LISTEN}
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ldap-data:/var/lib/ldap
    depends_on:
      certificates: {condition: service_completed_successfully}
    restart: unless-stopped
  ldap-auth:
    <<: *app
    command: [monitoring.ldap_auth]
    depends_on: {directory: {condition: service_started}}
  nginx:
    image: nginx:1.28.0
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ${RUNTIME_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${LOCAL_BIND}:${WEB_PORT}:8443"]
    depends_on:
      kibana: {condition: service_started}
      ldap-auth: {condition: service_started}
    restart: unless-stopped
  kafka-1: &kafka
    image: apache/kafka:4.0.0
    environment: &kafka-env
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISE_1}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
    restart: unless-stopped
  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISE_2}
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISE_3}
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
  kafka-init:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    entrypoint: [bash, /scripts/kafka-topics.sh]
    volumes: ["./scripts:/scripts:ro"]
    depends_on:
      kafka-1: {condition: service_started}
      kafka-2: {condition: service_started}
      kafka-3: {condition: service_started}
    restart: "no"
  bootstrap-fleet:
    <<: *app
    command: [scripts.bootstrap, fleet]
    restart: "no"
    depends_on:
      kibana: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}
  fleet:
    image: docker.elastic.co/beats/elastic-agent:8.19.19
    user: "0"
    entrypoint: [bash, /scripts/fleet-start.sh]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./scripts:/scripts:ro
      - fleet-data:/usr/share/elastic-agent/state
    ports: ["${LOCAL_BIND}:${FLEET_PORT}:8220"]
    depends_on:
      bootstrap-fleet: {condition: service_completed_successfully}
    restart: unless-stopped
  managed-apm:
    image: docker.elastic.co/beats/elastic-agent:8.19.19
    user: "0"
    entrypoint: [bash, /scripts/agent-start.sh]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./scripts:/scripts:ro
      - managed-apm-data:/usr/share/elastic-agent/state
    ports: ["${LOCAL_BIND}:${MANAGED_APM_PORT}:8200"]
    depends_on:
      fleet: {condition: service_started}
    restart: unless-stopped
  apm:
    image: docker.elastic.co/apm/apm-server:8.19.19
    env_file: ["${RUNTIME_DIR}/elastic.env"]
    command: [apm-server, -e, --strict.perms=false]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./config/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports: ["${LOCAL_BIND}:${APM_PORT}:8200"]
    depends_on:
      bootstrap-fleet: {condition: service_completed_successfully}
    restart: unless-stopped
  logstash-apm:
    image: docker.elastic.co/logstash/logstash:8.19.19
    env_file: ["${RUNTIME_DIR}/elastic.env"]
    environment: {LS_JAVA_OPTS: -Xms512m -Xmx512m}
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./config/logstash-apm.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash-apm-data:/usr/share/logstash/data
    depends_on:
      bootstrap-fleet: {condition: service_completed_successfully}
    restart: unless-stopped
  logstash-network:
    image: docker.elastic.co/logstash/logstash:8.19.19
    env_file: ["${RUNTIME_DIR}/elastic.env"]
    environment: {LS_JAVA_OPTS: -Xms512m -Xmx512m}
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./config/logstash-network.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash-network-data:/usr/share/logstash/data
    ports: ["${LOCAL_BIND}:${NETWORK_PORT}:5400/udp"]
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
    restart: unless-stopped
  heartbeat:
    image: docker.elastic.co/beats/heartbeat:8.19.19
    user: "0"
    cap_add: [NET_RAW]
    env_file: ["${RUNTIME_DIR}/elastic.env"]
    command: [heartbeat, -e, --strict.perms=false]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./config/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
    restart: unless-stopped
  alerting:
    <<: *app
    image: observability-alerting:local
    build: {context: ., dockerfile: docker/alerting.Dockerfile}
    entrypoint: [python, -m, scripts.alerting]
    volumes:
      - ${RUNTIME_DIR}:/runtime
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
  fleet-monitor:
    <<: *app
    command: [monitoring.fleet_monitor]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - agent-monitor-data:/state
    depends_on:
      bootstrap-fleet: {condition: service_completed_successfully}
  event-worker:
    <<: *app
    profiles: [itsm]
    command: [monitoring.worker]
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - event-worker-data:/state
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  f5-collector:
    <<: *app
    profiles: [f5]
    command: [monitoring.collectors, f5]
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
  vsphere-agent:
    image: docker.elastic.co/beats/elastic-agent:8.19.19
    profiles: [vsphere]
    user: "0"
    entrypoint: [bash, /scripts/agent-start.sh]
    environment:
      ENROLLMENT_FILE: /runtime/secrets/vsphere-enrollment
    volumes:
      - ${RUNTIME_DIR}:/runtime:ro
      - ./scripts:/scripts:ro
      - vsphere-agent-data:/usr/share/elastic-agent/state
    depends_on:
      fleet: {condition: service_started}
    restart: unless-stopped
  security-agent-collector:
    <<: *app
    profiles: [deepsecurity]
    command: [monitoring.collectors, deepsecurity]
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
  security-event-collector:
    <<: *app
    image: observability-security-collector:local
    build: {context: ., dockerfile: docker/security-collector.Dockerfile}
    entrypoint: [python, -m, monitoring.collectors, security-events]
    profiles: [security-events]
    depends_on:
      bootstrap-security: {condition: service_completed_successfully}
volumes:
  master-data:
  hot-data:
  cold-data:
  coordination-data:
  ldap-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  fleet-data:
  managed-apm-data:
  logstash-apm-data:
  logstash-network-data:
  agent-monitor-data:
  event-worker-data:
  vsphere-agent-data:
